name: Setup Dev Environment

on:
  push:
    branches:
      - "dev"  # Runs only when pushing to the dev branch
  workflow_dispatch:  # Allows manual triggering

jobs:
  setup-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: dhanmitra/test:dev

      - name: Start Dev Environment
        run: |
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for services to start
        run: sleep 10

      - name: Test PostgreSQL Connection
        run: |
          docker exec dm-postgres-dev psql -U dhanmitra -c "SELECT version();"

      - name: Test MinIO Connection
        run: |
          curl -I http://localhost:9002

      - name: Stop Dev Environment
        run: |
          docker compose -f docker-compose.dev.yml down
