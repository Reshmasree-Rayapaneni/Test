services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 87f5ce84d66c6ca661f614213858b0b4
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - /data/stack-1/pgdata:/var/lib/postgresql/data/pgdata

  minio:
    image: minio/minio:latest
    command: server /storage --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: M1HRD8PLVB3AUNWJII4WBXII
      MINIO_ROOT_PASSWORD: ONg70JbjewoFnK9h7RRR4V0m2whzOLiRHsXyreyk4yWJzk7g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - /data/stack-1/minio:/storage

  dm-engine:
    image: dhanmitra/dm-engine:stage
    ports:
      - "8000:8000"
    env_file: "dm-engine.env"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true

  admin-ops-ui:
    image: dhanmitra/admin-ops-ui:main
    ports:
      - "81:8080"
    restart: always
    environment:
      API_SERVER_URL: http://13.200.34.35:8000
